<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="sky1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1a3e"/>
      <stop offset="100%" stop-color="#020817"/>
    </radialGradient>
    <radialGradient id="moon1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dde9ff"/>
      <stop offset="100%" stop-color="#a8c4f0"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="480" fill="url(#sky1)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="45" cy="30" r="1.2"/><circle cx="120" cy="55" r="1"/><circle cx="200" cy="20" r="1.4"/>
    <circle cx="310" cy="45" r="1.1"/><circle cx="420" cy="15" r="1.3"/><circle cx="530" cy="38" r="1"/>
    <circle cx="640" cy="22" r="1.5"/><circle cx="730" cy="50" r="1.1"/><circle cx="760" cy="10" r="1"/>
    <circle cx="80" cy="80" r="0.9"/><circle cx="170" cy="70" r="1.2"/><circle cx="280" cy="90" r="1"/>
    <circle cx="380" cy="68" r="1.4"/><circle cx="470" cy="82" r="1.1"/><circle cx="580" cy="60" r="1"/>
    <circle cx="680" cy="75" r="1.3"/><circle cx="25" cy="110" r="1"/><circle cx="350" cy="110" r="1.2"/>
    <circle cx="600" cy="100" r="1"/><circle cx="750" cy="90" r="0.9"/>
  </g>

  <!-- Moon -->
  <circle cx="680" cy="75" r="38" fill="url(#moon1)" filter="url(#softglow)" opacity="0.9"/>
  <circle cx="695" cy="65" r="30" fill="#0b1a3e" opacity="0.25"/>

  <!-- Distant city haze -->
  <ellipse cx="400" cy="310" rx="380" ry="40" fill="#0d2460" opacity="0.35"/>

  <!-- Background buildings (far) -->
  <g fill="#0a1832" opacity="0.7">
    <rect x="30"  y="220" width="50" height="180"/>
    <rect x="90"  y="240" width="35" height="160"/>
    <rect x="135" y="200" width="60" height="200"/>
    <rect x="205" y="230" width="40" height="170"/>
    <rect x="255" y="215" width="55" height="185"/>
    <rect x="320" y="245" width="30" height="155"/>
    <rect x="360" y="205" width="65" height="195"/>
    <rect x="435" y="235" width="45" height="165"/>
    <rect x="490" y="218" width="50" height="182"/>
    <rect x="550" y="242" width="38" height="158"/>
    <rect x="598" y="210" width="58" height="190"/>
    <rect x="666" y="228" width="42" height="172"/>
    <rect x="718" y="200" width="55" height="200"/>
  </g>

  <!-- Mid buildings with windows -->
  <g fill="#0e1f40">
    <!-- Building 1 -->
    <rect x="20" y="160" width="80" height="320"/>
    <!-- Windows -->
    <g fill="#ffd700" opacity="0.7">
      <rect x="30" y="170" width="10" height="10"/><rect x="45" y="170" width="10" height="10"/>
      <rect x="60" y="170" width="10" height="10"/><rect x="75" y="170" width="10" height="10"/>
      <rect x="30" y="190" width="10" height="10"/><rect x="60" y="190" width="10" height="10"/>
      <rect x="30" y="210" width="10" height="10"/><rect x="45" y="210" width="10" height="10"/>
      <rect x="75" y="210" width="10" height="10"/>
    </g>
    <g fill="#4da6ff" opacity="0.6">
      <rect x="45" y="190" width="10" height="10"/><rect x="75" y="190" width="10" height="10"/>
      <rect x="60" y="210" width="10" height="10"/>
    </g>
  </g>

  <!-- Central skyscraper -->
  <g fill="#0a1530">
    <rect x="340" y="100" width="120" height="380"/>
    <!-- Antenna -->
    <rect x="395" y="70" width="10" height="35"/>
    <rect x="390" y="80" width="20" height="5"/>
    <!-- Windows - golden -->
    <g fill="#ffd700" opacity="0.65">
      <rect x="355" y="115" width="18" height="12"/><rect x="380" y="115" width="18" height="12"/>
      <rect x="405" y="115" width="18" height="12"/><rect x="430" y="115" width="18" height="12"/>
      <rect x="355" y="137" width="18" height="12"/><rect x="380" y="137" width="18" height="12"/>
      <rect x="430" y="137" width="18" height="12"/>
      <rect x="355" y="159" width="18" height="12"/><rect x="405" y="159" width="18" height="12"/>
      <rect x="430" y="159" width="18" height="12"/>
      <rect x="355" y="181" width="18" height="12"/><rect x="380" y="181" width="18" height="12"/>
      <rect x="405" y="181" width="18" height="12"/>
    </g>
    <!-- Windows - blue -->
    <g fill="#00d4ff" opacity="0.5">
      <rect x="405" y="137" width="18" height="12"/>
      <rect x="380" y="159" width="18" height="12"/>
      <rect x="430" y="181" width="18" height="12"/>
    </g>
    <!-- Lit windows lower floors -->
    <g fill="#ff9900" opacity="0.5">
      <rect x="355" y="203" width="18" height="12"/><rect x="430" y="225" width="18" height="12"/>
      <rect x="380" y="247" width="18" height="12"/>
    </g>
  </g>

  <!-- Left cluster buildings -->
  <g fill="#0b1935">
    <rect x="110" y="170" width="100" height="310"/>
    <g fill="#ffd700" opacity="0.6">
      <rect x="120" y="180" width="14" height="10"/><rect x="140" y="180" width="14" height="10"/>
      <rect x="160" y="180" width="14" height="10"/><rect x="185" y="180" width="14" height="10"/>
      <rect x="120" y="200" width="14" height="10"/><rect x="160" y="200" width="14" height="10"/>
      <rect x="185" y="200" width="14" height="10"/>
      <rect x="140" y="220" width="14" height="10"/><rect x="185" y="220" width="14" height="10"/>
    </g>
    <g fill="#00d4ff" opacity="0.45">
      <rect x="140" y="200" width="14" height="10"/>
      <rect x="120" y="220" width="14" height="10"/>
    </g>
    <rect x="220" y="190" width="80" height="290"/>
    <g fill="#ffd700" opacity="0.55">
      <rect x="230" y="200" width="12" height="9"/><rect x="250" y="200" width="12" height="9"/>
      <rect x="270" y="200" width="12" height="9"/>
      <rect x="230" y="220" width="12" height="9"/><rect x="270" y="220" width="12" height="9"/>
    </g>
  </g>

  <!-- Right cluster buildings -->
  <g fill="#0b1935">
    <rect x="490" y="155" width="110" height="325"/>
    <g fill="#ffd700" opacity="0.6">
      <rect x="500" y="165" width="14" height="10"/><rect x="520" y="165" width="14" height="10"/>
      <rect x="540" y="165" width="14" height="10"/><rect x="565" y="165" width="14" height="10"/>
      <rect x="500" y="185" width="14" height="10"/><rect x="565" y="185" width="14" height="10"/>
      <rect x="520" y="205" width="14" height="10"/><rect x="540" y="205" width="14" height="10"/>
    </g>
    <g fill="#00d4ff" opacity="0.45">
      <rect x="540" y="185" width="14" height="10"/>
      <rect x="500" y="205" width="14" height="10"/>
    </g>
    <rect x="610" y="175" width="90" height="305"/>
    <g fill="#ffd700" opacity="0.55">
      <rect x="620" y="185" width="13" height="9"/><rect x="640" y="185" width="13" height="9"/>
      <rect x="660" y="185" width="13" height="9"/>
      <rect x="620" y="205" width="13" height="9"/><rect x="675" y="205" width="13" height="9"/>
    </g>
    <rect x="710" y="190" width="90" height="290"/>
    <g fill="#ffd700" opacity="0.5">
      <rect x="720" y="200" width="12" height="9"/><rect x="740" y="200" width="12" height="9"/>
      <rect x="720" y="220" width="12" height="9"/>
    </g>
  </g>

  <!-- Street / ground -->
  <rect x="0" y="400" width="800" height="80" fill="#050c1a"/>

  <!-- Street lights -->
  <g stroke="#ffd060" stroke-width="1.5" opacity="0.8">
    <line x1="150" y1="380" x2="150" y2="420"/>
    <line x1="140" y1="381" x2="160" y2="381"/>
    <line x1="400" y1="375" x2="400" y2="425"/>
    <line x1="390" y1="376" x2="410" y2="376"/>
    <line x1="640" y1="380" x2="640" y2="420"/>
    <line x1="630" y1="381" x2="650" y2="381"/>
  </g>
  <!-- Street light glow -->
  <ellipse cx="150" cy="390" rx="25" ry="8" fill="#ffd060" opacity="0.12"/>
  <ellipse cx="400" cy="385" rx="25" ry="8" fill="#ffd060" opacity="0.12"/>
  <ellipse cx="640" cy="390" rx="25" ry="8" fill="#ffd060" opacity="0.12"/>

  <!-- Reflection in road -->
  <g opacity="0.15">
    <line x1="0" y1="430" x2="800" y2="430" stroke="#1e4080" stroke-width="1"/>
    <ellipse cx="400" cy="450" rx="200" ry="12" fill="#1a3a8f"/>
  </g>

  <!-- Subtle scan-line overlay for cyber effect -->
  <rect width="800" height="480" fill="url(#sky1)" opacity="0.06"/>

  <!-- Label -->
  <text x="16" y="466" font-family="monospace" font-size="11" fill="#2563eb" opacity="0.7">GRAPHKEY :: SCENE_01 :: CYBERCITY</text>
</svg>
